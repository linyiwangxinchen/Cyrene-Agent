name: package-windows

# Windows 安装包构建工作流（治理方案阶段 B）：
# - 复用与本地 package:win:dir 相同的构建链（build / build:screenshot-helper /
#   prepare:mingit / prepare:mpv），产出 NSIS 安装器并留存为工作流产物
# - --publish never：只构建不上传；应用更新源（GitHub Releases，由
#   update-packaging-config.test.ts 固定）不在本工作流变更
# - 发布（草稿 Release）待 GitHub 托管恢复后另建独立工作流：仅版本标签触发、
#   contents:write 最小权限、测试与安装验证通过后建草稿、人工核对再公开。
#   详见 docs/refactor/2026-09-14-engineering-governance-plan.md 阶段 B
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "可选：将验证通过的 Windows 资产上传到该 GitHub Release 标签"
        required: false
        type: string
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Set up Node.js 24 LTS
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm

      # 截图辅助程序用 cargo --locked 构建；win25 运行器镜像自带 Rust 工具链
      - name: Verify Rust toolchain
        run: cargo --version

      # 标签构建先做版本一致性检查，避免产物与标签对不上还白跑十几分钟
      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".Substring(1)
          $pkg = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($tag -ne $pkg) {
            Write-Error "标签版本 v$tag 与 package.json 版本 $pkg 不一致"
            exit 1
          }
          Write-Host "标签与 package.json 版本一致：$pkg"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Electron installation
        run: pnpm exec electron --version

      - name: Build application
        run: pnpm run build

      - name: Build screenshot helper (Rust, --locked)
        run: pnpm run build:screenshot-helper

      # 两个脚本自带 sha256 清单校验（vendor/*-manifest.json），缓存命中则跳过下载
      - name: Prepare MinGit
        run: pnpm run prepare:mingit

      - name: Prepare mpv
        run: pnpm run prepare:mpv

      - name: Build NSIS installer
        run: pnpm exec electron-builder --config electron-builder.fork.yml --win nsis --x64 --publish never

      # 验证安装器、latest.yml 更新元数据与 win-unpacked 内随包二进制齐全
      - name: Verify installer artifacts
        run: pnpm run verify:installer -- --config electron-builder.fork.yml

      - name: Create SHA-256 manifest
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $assets = @(
            "release/Cyrene-Windows-x64-Setup-$version.exe",
            "release/Cyrene-Windows-x64-Setup-$version.exe.blockmap",
            "release/latest.yml"
          )
          $manifest = "release/SHA256SUMS-Windows-$version.txt"
          $lines = foreach ($asset in $assets) {
            $hash = (Get-FileHash -LiteralPath $asset -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $([IO.Path]::GetFileName($asset))"
          }
          Set-Content -LiteralPath $manifest -Value $lines -Encoding utf8

      # 留存为内部测试产物，不自动公开发布
      - name: Upload installer artifacts
        uses: actions/upload-artifact@v7
        with:
          name: cyrene-windows-installer
          path: |
            release/Cyrene-*-Setup-*.exe
            release/Cyrene-*-Setup-*.exe.blockmap
            release/latest.yml
            release/SHA256SUMS-Windows-*.txt
          if-no-files-found: error
          # 安装器数百 MB，缩短留存时间避免占满产物配额
          retention-days: 14

      # Manual runs can publish the already verified assets to a draft Release.
      # Tag pushes keep the historical build-only behavior unless a release tag
      # is explicitly supplied through workflow_dispatch.
      - name: Publish GitHub Release assets
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag != '' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          $tag = $env:RELEASE_TAG
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($tag -ne "v$version") {
            Write-Error "Release 标签 $tag 与 package.json 版本 $version 不一致"
            exit 1
          }
          gh release upload $tag `
            "release/Cyrene-Windows-x64-Setup-$version.exe" `
            "release/Cyrene-Windows-x64-Setup-$version.exe.blockmap" `
            "release/latest.yml" `
            "release/SHA256SUMS-Windows-$version.txt" `
            --repo $env:GITHUB_REPOSITORY --clobber
          gh release edit $tag --draft=false --repo $env:GITHUB_REPOSITORY
